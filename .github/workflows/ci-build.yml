name: CI Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without v prefix'
        required: true
        default: '0.1.8'

jobs:
  bump-version:
    # Skip if the commit IS the version bump to avoid loops (though GITHUB_TOKEN prevents it anyway)
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Head
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump Version
        id: get_version
        working-directory: bili-ticker-buy-rust
        run: |
          # Calculate new version
          node scripts/bump-version.js
          
          # Read new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Bumping to $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Commit and Tag
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): bump version to v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          
          # Push
          git push origin main
          git push origin "v$NEW_VERSION"

  build-release:
    needs: bump-version
    if: always() && (needs.bump-version.outputs.new_version != '' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || needs.bump-version.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ env.RELEASE_VERSION }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: install frontend dependencies
        working-directory: bili-ticker-buy-rust
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: bili-ticker-buy-rust
        run: pnpm tauri build

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        working-directory: bili-ticker-buy-rust
        run: bash scripts/verify-macos-bundle.sh

      - name: Upload release assets
        working-directory: bili-ticker-buy-rust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/upload-release-assets.sh "${{ env.RELEASE_VERSION }}"
